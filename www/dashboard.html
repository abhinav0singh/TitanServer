<!DOCTYPE html>
<html>
<head>
    <title>TitanServer Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            padding: 20px;
        }

        button {
            margin: 6px;
            padding: 10px 14px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        pre {
            background: #020617;
            padding: 12px;
            border-radius: 4px;
            margin-top: 10px;
            max-height: 300px;
            overflow: auto;
        }
    </style>
</head>

<body>
    <h1> TitanServer Dashboard</h1>
    <p>This UI sends real HTTP requests to a C++ backend.</p>

    <button onclick="call('/health')">Health Check</button>
    <button onclick="call('/')">Load Home</button>
    <button onclick="call('/stats')">Server Stats</button>
    <button onclick="call('/slow')">Simulate Slow Request</button>

    <pre id="output">Response will appear here...</pre>

    <script>
        async function call(path) {
        const out = document.getElementById('output');
        out.textContent = 'Loading...';

        try {
        const res = await fetch(path);
        const text = await res.text();
        out.textContent = text;
        } catch (err) {
        out.textContent = err.toString();
        }
        }
    </script>
</body>
</html>
